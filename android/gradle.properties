# Gradle JVM arguments (updated for 16KB page size compatibility)
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC

# Android configuration
android.useAndroidX=true
android.enableJetifier=true

# Release build optimizations
android.enableR8.fullMode=true

# Gradle optimizations
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# 16KB page size support for Google Play Store requirement
# Enable 16KB page size support
android.experimental.legacyTransform.forceNonIncremental=true
android.experimental.art.profile.stripMarkers=false
android.experimental.androidTest.numManagedDeviceShards=1

# Memory configuration for 16KB page sizes (configured above)

# 16KB page size system properties
systemProp.dalvik.vm.usejit=true
systemProp.ro.kernel.qemu=0
